<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>医学影像技术技士技师医院招聘专用题库</title>
  <script src="./imaging_mobile_data.js?v=20260608-6"></script>
  <style>
    :root {
      --bg: #f5f1e8;
      --paper: rgba(255, 252, 246, 0.96);
      --ink: #1b221d;
      --muted: #6d766f;
      --line: #ddd4c6;
      --brand: #1f5b4a;
      --brand-soft: #dfe9e2;
      --accent: #bf6b3d;
      --accent-soft: #f7e8de;
      --danger: #b54a42;
      --danger-soft: rgba(181, 74, 66, 0.12);
      --ok: #2d7b56;
      --ok-soft: rgba(45, 123, 86, 0.12);
      --radius: 18px;
      --shadow: 0 16px 36px rgba(27, 34, 29, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(191, 107, 61, 0.13), transparent 26%),
        linear-gradient(180deg, #f8f4ec 0%, #f1ede4 100%);
      min-height: 100vh;
    }

    button,
    select {
      font: inherit;
    }

    .app {
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 16px 14px 28px;
    }

    .hidden {
      display: none !important;
    }

    .activation-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px 28px;
    }

    .activation-card {
      width: min(100%, 430px);
      background: var(--paper);
      border: 1px solid rgba(221, 212, 198, 0.9);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 24px 18px 20px;
    }

    .activation-title {
      font-size: 28px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .activation-sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .activation-input {
      width: 100%;
      border: 1px solid rgba(221, 212, 198, 0.92);
      border-radius: 16px;
      padding: 14px 14px;
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #fff;
      color: var(--ink);
      outline: none;
      margin-bottom: 12px;
    }

    .activation-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(31, 91, 74, 0.08);
    }

    .activation-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 10px;
      text-align: center;
    }

    .activation-status {
      min-height: 22px;
      margin-top: 10px;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .hero,
    .card,
    .question-card {
      background: var(--paper);
      border: 1px solid rgba(221, 212, 198, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 20px 18px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -24px;
      top: -28px;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: rgba(31, 91, 74, 0.08);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    h1 {
      margin-top: 10px;
      font-size: 28px;
      line-height: 1.2;
    }

    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 280px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .stat {
      flex: 1;
      min-width: 100px;
      padding: 12px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(221, 212, 198, 0.92);
    }

    .stat b {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .stat span {
      font-size: 12px;
      color: var(--muted);
    }

    .menu {
      display: grid;
      gap: 10px;
    }

    .menu-btn,
    .btn,
    .option,
    select {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(221, 212, 198, 0.92);
    }

    .menu-btn,
    .btn,
    .option {
      background: #fff;
      color: var(--ink);
    }

    .menu-btn,
    .btn {
      cursor: pointer;
    }

    .menu-btn {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      box-shadow: 0 10px 26px rgba(27, 34, 29, 0.05);
    }

    .menu-btn strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .menu-btn small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      max-width: 240px;
    }

    .menu-btn.disabled {
      opacity: 0.55;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.warn {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .pill.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .back {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid rgba(221, 212, 198, 0.92);
      background: #fff;
      font-size: 18px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .topbar h2 {
      font-size: 20px;
      line-height: 1.2;
    }

    .topbar p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .card {
      padding: 14px;
      margin-bottom: 12px;
    }

    .filters {
      display: grid;
      gap: 8px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    select {
      padding: 12px;
      background: #fff;
      color: var(--ink);
    }

    .mini-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .btn {
      padding: 13px 14px;
      font-weight: 700;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn.primary {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .btn.secondary {
      background: #fff;
      color: var(--ink);
    }

    .btn.ghost {
      background: #f8f4ec;
      color: var(--accent);
      border-color: rgba(191, 107, 61, 0.28);
    }

    .btn.star {
      background: #fff8ea;
      color: #9a6200;
      border-color: rgba(154, 98, 0, 0.24);
    }

    .btn.star.active {
      background: #ffe8ab;
      color: #6e4600;
    }

    .helper {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .question-card {
      padding: 16px;
      margin-bottom: 12px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
    }

    .tag.alt {
      background: #f2ebe0;
      color: var(--accent);
    }

    .tag.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .question-title {
      font-size: 17px;
      line-height: 1.65;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .options {
      display: grid;
      gap: 9px;
    }

    .option {
      padding: 13px 14px;
      text-align: left;
      line-height: 1.55;
      font-size: 14px;
      cursor: pointer;
    }

    .option.selected {
      border-color: var(--brand);
      background: var(--brand-soft);
    }

    .option.correct {
      border-color: rgba(45, 123, 86, 0.5);
      background: var(--ok-soft);
      color: var(--ok);
    }

    .option.wrong {
      border-color: rgba(181, 74, 66, 0.46);
      background: rgba(181, 74, 66, 0.1);
      color: var(--danger);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .explanation {
      display: none;
      margin-top: 14px;
      padding: 12px 13px;
      border-radius: 14px;
      background: #f6efe4;
      color: #475147;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* 目录模态框样式 */
    .modal-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.2s, opacity 0.2s;
    }

    .modal-mask.active {
      visibility: visible;
      opacity: 1;
    }

    .directory-modal {
      width: min(92%, 380px);
      max-height: 80vh;
      background: var(--paper);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(221, 212, 198, 0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      font-size: 18px;
      background: rgba(255, 252, 246, 0.98);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
      line-height: 1;
    }

    .directory-list {
      overflow-y: auto;
      padding: 12px 8px;
      flex: 1;
    }

    .directory-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      margin-bottom: 8px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid rgba(221, 212, 198, 0.7);
      cursor: pointer;
      transition: all 0.1s;
    }

    .directory-item.active {
      background: var(--brand-soft);
      border-color: var(--brand);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.correct-status {
      background-color: var(--ok);
      box-shadow: 0 0 0 2px rgba(45, 123, 86, 0.2);
    }

    .status-dot.wrong-status {
      background-color: var(--danger);
      box-shadow: 0 0 0 2px rgba(181, 74, 66, 0.2);
    }

    .directory-info {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
      overflow: hidden;
    }

    .directory-chapter {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .directory-text {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      text-align: center;
      padding: 34px 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 360px) {
      .filter-grid,
      .actions {
        grid-template-columns: 1fr;
      }
      .mini-row {
        grid-template-columns: 1fr;
      }
      .directory-item {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <section class="activation-shell" id="activation-screen">

  <script>
    // Supabase 配置，已填入你当前项目的地址与公钥
    const SUPABASE_URL = "https://nubycnpfqtcbaqnfvgtm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gokiweZcpV_gg9twBR8F-g_ElRhXM1g";
    const SUPABASE_ACTIVATION_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/super-processor`;

    const activationStatusKey = "imaging_activation_ok_v1";
    const activationAttemptKey = "imaging_activation_attempts_v1";
    const activationCodeKey = "imaging_activation_code_v1";

    const questionBank = Array.isArray(window.__QUESTION_BANK__) ? window.__QUESTION_BANK__ : [];
    const meta = window.__APP_META__ || {};

    const wrongStorageKey = "imaging_wrong_ids_v2";
    const favoriteStorageKey = "imaging_favorite_ids_v1";
    const progressStorageKey = "imaging_progress_v1";

    const screens = {
      home: document.getElementById("home-screen"),
      practice: document.getElementById("practice-screen")
    };

    const state = {
      currentScreen: "home",
      currentQuestion: null,
      selectedAnswers: [],
      submitted: false
    };

    const typeMap = {
      all: "全部题型",
      single: "单选题",
      multiple: "多选题",
      judgment: "判断题"
    };

    const modeMap = {
      all: "随机刷题",
      wrong: "错题重练",
      favorite: "收藏题"
    };

    const orderMap = {
      random: "随机抽题",
      sequence: "顺序刷题"
    };

    // 激活码相关函数 (保持不变)
    function formatActivationCode(value) {
      const cleaned = String(value || "").toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g, "").slice(0, 16);
      return cleaned.match(/.{1,4}/g)?.join("-") || "";
    }
    function isValidActivationCode(value) {
      return /^[A-HJ-NP-Z2-9]{4}(?:-[A-HJ-NP-Z2-9]{4}){3}$/.test(value);
    }
    function loadActivationAttempts() {
      try { const raw = localStorage.getItem(activationAttemptKey); const data = raw ? JSON.parse(raw) : null; return data && typeof data === "object" ? data : { count: 0, firstAt: 0 }; } catch (error) { return { count: 0, firstAt: 0 }; }
    }
    function saveActivationAttempts(data) { localStorage.setItem(activationAttemptKey, JSON.stringify(data)); }
    function canTryActivation() {
      const now = Date.now(); const data = loadActivationAttempts();
      if (!data.firstAt || now - data.firstAt > 60 * 60 * 1000) { saveActivationAttempts({ count: 0, firstAt: 0 }); return true; }
      return data.count < 5;
    }
    function registerActivationAttempt() {
      const now = Date.now(); const data = loadActivationAttempts();
      if (!data.firstAt || now - data.firstAt > 60 * 60 * 1000) { saveActivationAttempts({ count: 1, firstAt: now }); return; }
      saveActivationAttempts({ count: data.count + 1, firstAt: data.firstAt });
    }
    function clearActivationAttempts() { saveActivationAttempts({ count: 0, firstAt: 0 }); }
    function getSavedActivationCode() { return localStorage.getItem(activationCodeKey) || ""; }
    function isActivated() { return localStorage.getItem(activationStatusKey) === "1" && !!getSavedActivationCode(); }
    function markActivated(code) { localStorage.setItem(activationStatusKey, "1"); localStorage.setItem(activationCodeKey, code); }
    function clearActivationState() { localStorage.removeItem(activationStatusKey); localStorage.removeItem(activationCodeKey); }
    function simpleHash(text) { let hash = 2166136261; for (let index = 0; index < text.length; index += 1) { hash ^= text.charCodeAt(index); hash = Math.imul(hash, 16777619); } return Math.abs(hash >>> 0).toString(16).padStart(8, "0"); }
    async function sha256Hex(text) { if (window.crypto && window.crypto.subtle && window.TextEncoder) { const bytes = new TextEncoder().encode(text); const digest = await window.crypto.subtle.digest("SHA-256", bytes); return [...new Uint8Array(digest)].map(item => item.toString(16).padStart(2, "0")).join(""); } return simpleHash(text.repeat(4)).padEnd(32, "0"); }
    async function getDeviceFingerprint() { const parts = [navigator.userAgent || "", navigator.language || "", navigator.platform || "", String(navigator.hardwareConcurrency || ""), String(navigator.maxTouchPoints || ""), `${screen.width || 0}x${screen.height || 0}`, String(screen.colorDepth || ""), Intl.DateTimeFormat().resolvedOptions().timeZone || "", String(new Date().getTimezoneOffset())]; return sha256Hex(parts.join("|")); }
    function getDeviceLabel() { const parts = [navigator.platform || "unknown", navigator.language || "", `${screen.width || 0}x${screen.height || 0}`].filter(Boolean); return parts.join(" | ").slice(0, 120); }
    function setActivationStatus(message, ok) { const node = document.getElementById("activation-status"); node.textContent = message || ""; node.style.color = ok ? "var(--ok)" : "var(--danger)"; }
    function showMainApp() { document.getElementById("activation-screen").classList.add("hidden"); document.getElementById("main-app").classList.remove("hidden"); }
    async function verifyActivationByFunction(code, mode) {
      const url = SUPABASE_ACTIVATION_FUNCTION_URL; const deviceFingerprint = await getDeviceFingerprint(); const deviceLabel = getDeviceLabel();
      const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }, body: JSON.stringify({ mode, code, deviceFingerprint, deviceLabel }) });
      let payload = null; try { payload = await response.json(); } catch (_error) { payload = null; }
      if (!response.ok) { if (payload && payload.message) return payload; throw new Error("network"); }
      return payload || { ok: true };
    }
    async function verifyActivationCode() {
      const input = document.getElementById("activation-code"); const button = document.getElementById("activation-submit"); const code = formatActivationCode(input.value); input.value = code;
      if (!canTryActivation()) { setActivationStatus("尝试次数过多，请1小时后再试", false); return; }
      if (!isValidActivationCode(code)) { registerActivationAttempt(); setActivationStatus("激活码格式不正确", false); return; }
      button.disabled = true; setActivationStatus("验证中，请稍候...", true);
      try { const result = await verifyActivationByFunction(code, "activate"); if (!result || result.ok !== true) { registerActivationAttempt(); setActivationStatus(result?.message || "激活码无效或已被使用", false); return; } markActivated(code); clearActivationAttempts(); setActivationStatus("激活成功，正在进入...", true); showMainApp(); } catch (error) { registerActivationAttempt(); setActivationStatus("网络错误，请检查连接", false); } finally { button.disabled = false; }
    }
    function bindActivationEvents() { const input = document.getElementById("activation-code"); const button = document.getElementById("activation-submit"); input.addEventListener("input", () => { input.value = formatActivationCode(input.value); }); input.addEventListener("keydown", event => { if (event.key === "Enter") verifyActivationCode(); }); button.addEventListener("click", verifyActivationCode); }
    async function restoreActivationSession() { if (!isActivated()) return; const savedCode = formatActivationCode(getSavedActivationCode()); if (!savedCode) { clearActivationState(); return; } try { setActivationStatus("正在校验当前设备...", true); const result = await verifyActivationByFunction(savedCode, "validate"); if (!result || result.ok !== true) { clearActivationState(); setActivationStatus(result?.message || "当前设备需要重新激活", false); return; } markActivated(savedCode); showMainApp(); } catch (_error) { clearActivationState(); setActivationStatus("网络错误，请重新激活", false); } }

    function showScreen(name) { Object.entries(screens).forEach(([key, el]) => { el.classList.toggle("active", key === name); }); state.currentScreen = name; window.scrollTo(0, 0); }
    function unique(arr) { return [...new Set(arr.filter(Boolean))]; }
    function loadIdSet(key) { try { const raw = localStorage.getItem(key); const list = raw ? JSON.parse(raw) : []; return new Set(Array.isArray(list) ? list : []); } catch (error) { return new Set(); } }
    function saveIdSet(key, set) { localStorage.setItem(key, JSON.stringify([...set])); }
    function loadProgress() { try { const raw = localStorage.getItem(progressStorageKey); const progress = raw ? JSON.parse(raw) : null; return progress && typeof progress === "object" ? progress : null; } catch (error) { return null; } }
    function saveProgress(data) { localStorage.setItem(progressStorageKey, JSON.stringify(data)); updateHomeStats(); }
    function clearProgress() { localStorage.removeItem(progressStorageKey); updateHomeStats(); }
    function getCurrentFilters() { return { mode: document.getElementById("practice-mode").value, order: document.getElementById("practice-order").value, type: document.getElementById("practice-type").value, chapter: document.getElementById("practice-chapter").value }; }
    function saveCurrentProgress(questionId) { const filters = getCurrentFilters(); saveProgress({ mode: filters.mode, type: filters.type, chapter: filters.chapter, questionId: questionId || (state.currentQuestion ? state.currentQuestion.id : null), updatedAt: Date.now() }); }
    function updateHomeStats() { const wrongIds = loadIdSet(wrongStorageKey); const favoriteIds = loadIdSet(favoriteStorageKey); document.getElementById("stat-questions").textContent = meta.totalQuestions || questionBank.length; document.getElementById("stat-wrong").textContent = wrongIds.size; document.getElementById("stat-favorite").textContent = favoriteIds.size; document.getElementById("home-wrong-pill").textContent = `${wrongIds.size}题`; document.getElementById("home-favorite-pill").textContent = `${favoriteIds.size}题`; const progress = loadProgress(); const resumeBtn = document.getElementById("go-resume"); const resumeText = document.getElementById("resume-text"); const resumePill = document.getElementById("resume-pill"); if (progress && progress.questionId) { resumeBtn.classList.remove("disabled"); resumeText.textContent = `上次停在${modeMap[progress.mode] || "刷题"}，可直接继续。`; resumePill.textContent = "继续"; } else { resumeBtn.classList.add("disabled"); resumeText.textContent = "还没有保存的刷题位置。"; resumePill.textContent = "暂无"; } }
    function makeOptions(select, values, labels) { select.innerHTML = values.map(value => { const label = labels ? labels[value] : value; return `<option value="${value}">${label}</option>`; }).join(""); }
    function setupPracticeFilters() { const modeSelect = document.getElementById("practice-mode"); const orderSelect = document.getElementById("practice-order"); const typeSelect = document.getElementById("practice-type"); const chapterSelect = document.getElementById("practice-chapter"); const chapters = unique(questionBank.map(item => item.chapter)).sort((a, b) => a.localeCompare(b, "zh-CN")); makeOptions(modeSelect, ["all", "wrong", "favorite"], modeMap); makeOptions(orderSelect, ["random", "sequence"], orderMap); makeOptions(typeSelect, ["all", "single", "multiple", "judgment"], typeMap); makeOptions(chapterSelect, ["all", ...chapters], null); chapterSelect.options[0].text = "全部章节"; }
    function normalizeAnswer(value) { return [...new Set(String(value || "").replace(/[^A-Z]/gi, "").toUpperCase().split(""))].sort().join(""); }
    function getSelectedAnswer() { return [...state.selectedAnswers].sort().join(""); }
    function isMultipleQuestion(question) { return question && question.type === "multiple"; }
    function isFavoriteQuestion(questionId) { return loadIdSet(favoriteStorageKey).has(questionId); }
    function getPracticePool() { const mode = document.getElementById("practice-mode").value; const type = document.getElementById("practice-type").value; const chapter = document.getElementById("practice-chapter").value; const wrongIds = loadIdSet(wrongStorageKey); const favoriteIds = loadIdSet(favoriteStorageKey); return questionBank.filter(item => { const typePass = type === "all" || item.type === type; const chapterPass = chapter === "all" || item.chapter === chapter; const modePass = mode === "all" || (mode === "wrong" && wrongIds.has(item.id)) || (mode === "favorite" && favoriteIds.has(item.id)); return typePass && chapterPass && modePass; }); }
    function sample(list, excludeId) { if (!list.length) return null; if (list.length === 1) return list[0]; const filtered = excludeId ? list.filter(item => item.id !== excludeId) : list; const source = filtered.length ? filtered : list; return source[Math.floor(Math.random() * source.length)]; }
    function findQuestionById(questionId) { return questionBank.find(item => item.id === questionId) || null; }
    function setFiltersByProgress(progress) { const modeSelect = document.getElementById("practice-mode"); const orderSelect = document.getElementById("practice-order"); const typeSelect = document.getElementById("practice-type"); const chapterSelect = document.getElementById("practice-chapter"); modeSelect.value = modeMap[progress.mode] ? progress.mode : "all"; orderSelect.value = orderMap[progress.order] ? progress.order : "random"; typeSelect.value = typeMap[progress.type] ? progress.type : "all"; const chapterExists = [...chapterSelect.options].some(option => option.value === progress.chapter); chapterSelect.value = chapterExists ? progress.chapter : "all"; }
    function updateManageButton() { const mode = document.getElementById("practice-mode").value; const button = document.getElementById("mode-manage"); if (mode === "wrong") button.textContent = "清空错题"; else if (mode === "favorite") button.textContent = "清空收藏"; else button.textContent = "清空进度"; }
    function setPracticeInfo(poolLength) { const mode = document.getElementById("practice-mode").value; const order = document.getElementById("practice-order").value; const pool = getPracticePool(); const currentIndex = state.currentQuestion ? pool.findIndex(item => item.id === state.currentQuestion.id) : -1; const modeLabel = modeMap[mode] || "随机刷题"; const orderLabel = orderMap[order] || "随机抽题"; const positionText = currentIndex >= 0 ? `，当前第 ${currentIndex + 1} / ${poolLength} 题` : ""; document.getElementById("practice-pool-info").textContent = `当前模式：${modeLabel}，出题方式：${orderLabel}，可刷题目 ${poolLength} 道${positionText}。`; updateManageButton(); }
    function getCurrentPoolIndex(pool) { if (!state.currentQuestion) return -1; return pool.findIndex(item => item.id === state.currentQuestion.id); }
    function getOrderedQuestion(pool, step) { if (!pool.length) return null; const currentIndex = getCurrentPoolIndex(pool); if (currentIndex < 0) return pool[0]; const nextIndex = currentIndex + step; if (nextIndex < 0 || nextIndex >= pool.length) return pool[currentIndex]; return pool[nextIndex]; }
    function buildPracticeEmpty() { const mode = document.getElementById("practice-mode").value; const type = document.getElementById("practice-type").value; const chapter = document.getElementById("practice-chapter").value; const wrongIds = loadIdSet(wrongStorageKey); const favoriteIds = loadIdSet(favoriteStorageKey); const scopedPool = questionBank.filter(item => { const chapterPass = chapter === "all" || item.chapter === chapter; const modePass = mode === "all" || (mode === "wrong" && wrongIds.has(item.id)) || (mode === "favorite" && favoriteIds.has(item.id)); return chapterPass && modePass; }); if (mode === "wrong" && !scopedPool.length) return "当前没有错题，先去随机刷题。答错的题会自动进入错题本。"; if (mode === "favorite" && !scopedPool.length) return "当前没有收藏题，刷题时点“收藏本题”即可加入。"; if (type !== "all" && scopedPool.length) { const counts = { single: scopedPool.filter(item => item.type === "single").length, multiple: scopedPool.filter(item => item.type === "multiple").length, judgment: scopedPool.filter(item => item.type === "judgment").length }; if (!counts[type]) { const available = Object.entries(counts).filter(([, count]) => count > 0).map(([key, count]) => `${typeMap[key]} ${count} 道`).join("，"); if (chapter !== "all") return `当前章节“${chapter}”下没有${typeMap[type]}。${available ? `本章节现有：${available}。` : ""}请切换题型或改为“全部题型”。`; } } return "当前筛选条件下没有题目。"; }
    function renderPractice(preferredQuestionId) { const host = document.getElementById("practice-body"); const pool = getPracticePool(); setPracticeInfo(pool.length); if (!pool.length) { state.currentQuestion = null; state.selectedAnswers = []; state.submitted = false; host.innerHTML = `<div class="card empty">${buildPracticeEmpty()}</div>`; saveCurrentProgress(null); return; } let question = null; if (preferredQuestionId) question = pool.find(item => item.id === preferredQuestionId) || null; if (!question && state.currentQuestion && pool.some(item => item.id === state.currentQuestion.id)) question = state.currentQuestion; if (!question) question = document.getElementById("practice-order").value === "sequence" ? pool[0] : sample(pool); state.currentQuestion = question; state.selectedAnswers = []; state.submitted = false; const typeLabel = typeMap[question.type] || "题目"; const sourceLabel = question.sourceTag === "sanji_text" ? "三基题库" : "招聘题库"; const noteLabel = isMultipleQuestion(question) ? "多选题，需选全" : "单项作答"; const favoriteText = isFavoriteQuestion(question.id) ? "取消收藏" : "收藏本题"; const favoriteClass = isFavoriteQuestion(question.id) ? "btn star active" : "btn star"; host.innerHTML = `<div class="question-card"><div class="meta"><span class="tag">${question.chapter || "未分类"}</span><span class="tag alt">${typeLabel}</span><span class="tag alt">${sourceLabel}</span><span class="tag danger">${noteLabel}</span></div><div class="question-title">${question.question}</div><div class="options" id="question-options">${(Array.isArray(question.options) ? question.options : []).map((option, index) => `<button class="option" type="button" data-value="${String.fromCharCode(65 + index)}">${option}</button>`).join("")}</div><div class="actions"><button class="btn secondary" type="button" id="prev-question">上一题</button><button class="btn secondary" type="button" id="submit-answer">提交答案</button><button class="btn primary" type="button" id="next-question">下一题</button><button class="${favoriteClass}" type="button" id="toggle-favorite">${favoriteText}</button></div><div class="explanation" id="question-explanation"></div></div>`; host.querySelectorAll(".option").forEach(button => { button.addEventListener("click", () => handleOptionClick(button.dataset.value)); }); document.getElementById("prev-question").addEventListener("click", prevQuestion); document.getElementById("submit-answer").addEventListener("click", submitAnswer); document.getElementById("next-question").addEventListener("click", nextQuestion); document.getElementById("toggle-favorite").addEventListener("click", toggleFavoriteCurrent); const prevButton = document.getElementById("prev-question"); const sequenceMode = document.getElementById("practice-order").value === "sequence"; const currentIndex = pool.findIndex(item => item.id === question.id); prevButton.disabled = !sequenceMode || currentIndex <= 0; saveCurrentProgress(question.id); setPracticeInfo(pool.length); }
    function handleOptionClick(value) { if (!state.currentQuestion || state.submitted) return; if (isMultipleQuestion(state.currentQuestion)) { if (state.selectedAnswers.includes(value)) state.selectedAnswers = state.selectedAnswers.filter(item => item !== value); else state.selectedAnswers = [...state.selectedAnswers, value]; } else { state.selectedAnswers = [value]; } document.querySelectorAll("#question-options .option").forEach(node => { node.classList.toggle("selected", state.selectedAnswers.includes(node.dataset.value)); }); saveCurrentProgress(state.currentQuestion.id); }
    function updateWrongBook(question, correct) { const wrongIds = loadIdSet(wrongStorageKey); if (correct) wrongIds.delete(question.id); else wrongIds.add(question.id); saveIdSet(wrongStorageKey, wrongIds); updateHomeStats(); }
    function submitAnswer() { if (!state.currentQuestion || !state.selectedAnswers.length) return; state.submitted = true; const question = state.currentQuestion; const expected = normalizeAnswer(question.answer); const selected = normalizeAnswer(getSelectedAnswer()); const correct = expected === selected; document.querySelectorAll("#question-options .option").forEach(node => { const value = node.dataset.value; const isCorrectOption = expected.includes(value); const isSelected = selected.includes(value); if (isCorrectOption) node.classList.add("correct"); if (isSelected && !isCorrectOption) node.classList.add("wrong"); }); updateWrongBook(question, correct); const explanation = document.getElementById("question-explanation"); explanation.style.display = "block"; explanation.textContent = `你的答案：${selected || "未作答"}\n正确答案：${expected}\n${question.explanation || ""}`; saveCurrentProgress(question.id); if (document.getElementById("practice-mode").value === "wrong") setPracticeInfo(getPracticePool().length); }
    function nextQuestion() { const pool = getPracticePool(); if (!pool.length) { renderPractice(); return; } const order = document.getElementById("practice-order").value; const next = order === "sequence" ? getOrderedQuestion(pool, 1) : sample(pool, state.currentQuestion ? state.currentQuestion.id : null); renderPractice(next ? next.id : null); }
    function prevQuestion() { const pool = getPracticePool(); if (!pool.length) return; if (document.getElementById("practice-order").value !== "sequence") return; const prev = getOrderedQuestion(pool, -1); renderPractice(prev ? prev.id : null); }
    function toggleFavoriteCurrent() { if (!state.currentQuestion) return; const favoriteIds = loadIdSet(favoriteStorageKey); if (favoriteIds.has(state.currentQuestion.id)) favoriteIds.delete(state.currentQuestion.id); else favoriteIds.add(state.currentQuestion.id); saveIdSet(favoriteStorageKey, favoriteIds); updateHomeStats(); if (document.getElementById("practice-mode").value === "favorite" && !favoriteIds.has(state.currentQuestion.id)) { const pool = getPracticePool(); const replacement = sample(pool, state.currentQuestion.id); renderPractice(replacement ? replacement.id : null); return; } renderPractice(state.currentQuestion.id); }
    function clearCurrentModeData() { const mode = document.getElementById("practice-mode").value; if (mode === "wrong") saveIdSet(wrongStorageKey, new Set()); else if (mode === "favorite") saveIdSet(favoriteStorageKey, new Set()); else clearProgress(); updateHomeStats(); renderPractice(); }
    function restoreLastProgress() { const progress = loadProgress(); if (!progress || !progress.questionId) return; setFiltersByProgress(progress); showScreen("practice"); state.currentQuestion = findQuestionById(progress.questionId); renderPractice(progress.questionId); }

    // 目录模块
    function renderDirectory() {
      const container = document.getElementById("directory-list-container");
      const pool = getPracticePool();
      if (!pool.length) { container.innerHTML = '<div class="empty">当前筛选条件下没有题目</div>'; return; }
      const wrongSet = loadIdSet(wrongStorageKey);
      const currentId = state.currentQuestion ? state.currentQuestion.id : null;
      container.innerHTML = pool.map(item => {
        const isWrong = wrongSet.has(item.id);
        const statusClass = isWrong ? "wrong-status" : "correct-status";
        const shortText = item.question.length > 38 ? item.question.slice(0, 35) + "…" : item.question;
        const activeClass = currentId === item.id ? "active" : "";
        return `<div class="directory-item ${activeClass}" data-id="${item.id}">
          <div class="status-dot ${statusClass}"></div>
          <div class="directory-info">
            <div class="directory-chapter">${item.chapter || "未分类"} · ${typeMap[item.type] || "题目"}</div>
            <div class="directory-text">${shortText}</div>
          </div>
        </div>`;
      }).join("");
      container.querySelectorAll(".directory-item").forEach(el => {
        el.addEventListener("click", (e) => {
          const qid = el.dataset.id;
          if (qid) {
            closeDirectoryModal();
            const targetQuestion = findQuestionById(qid);
            if (targetQuestion) renderPractice(qid);
          }
        });
      });
    }

    function openDirectoryModal() { renderDirectory(); document.getElementById("directory-modal").classList.add("active"); }
    function closeDirectoryModal() { document.getElementById("directory-modal").classList.remove("active"); }

    function bindEvents() {
      document.getElementById("go-practice").addEventListener("click", () => { document.getElementById("practice-mode").value = "all"; state.currentQuestion = null; showScreen("practice"); renderPractice(); });
      document.getElementById("go-resume").addEventListener("click", () => { restoreLastProgress(); });
      document.getElementById("go-wrong").addEventListener("click", () => { document.getElementById("practice-mode").value = "wrong"; state.currentQuestion = null; showScreen("practice"); renderPractice(); });
      document.getElementById("go-favorite").addEventListener("click", () => { document.getElementById("practice-mode").value = "favorite"; state.currentQuestion = null; showScreen("practice"); renderPractice(); });
      document.querySelectorAll("[data-back]").forEach(button => { button.addEventListener("click", () => showScreen("home")); });
      document.getElementById("practice-mode").addEventListener("change", () => { state.currentQuestion = null; renderPractice(); });
      document.getElementById("practice-order").addEventListener("change", () => { state.currentQuestion = null; renderPractice(); });
      document.getElementById("practice-type").addEventListener("change", () => { state.currentQuestion = null; renderPractice(); });
      document.getElementById("practice-chapter").addEventListener("change", () => { state.currentQuestion = null; renderPractice(); });
      document.getElementById("refresh-question").addEventListener("click", () => { nextQuestion(); });
      document.getElementById("mode-manage").addEventListener("click", clearCurrentModeData);
      document.getElementById("open-directory").addEventListener("click", openDirectoryModal);
      document.getElementById("close-directory").addEventListener("click", closeDirectoryModal);
      document.getElementById("directory-modal").addEventListener("click", (e) => { if (e.target === document.getElementById("directory-modal")) closeDirectoryModal(); });
    }

    bindActivationEvents();
    updateHomeStats();
    setupPracticeFilters();
    bindEvents();
    restoreActivationSession();
  </script>
